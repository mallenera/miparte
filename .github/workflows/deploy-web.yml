name: Desplegar web
# Publica el front (Blazor WASM) en Cloudflare Pages con subida directa: el SDK de .NET 10 no está en el entorno
# de build de Pages. Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID y la variable CORE_URL.
on:
  push:
    branches: [master]
    paths:
      - "src/Web/**"
      - "src/Contracts/**"
      - "src/Core/Core.Domain/**"
      - "tests/pwa/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desplegar:
    # workflow_dispatch puede lanzarse desde cualquier rama: solo master publica en producción.
    if: github.ref == 'refs/heads/master'
    # Fijado: Playwright 1.56.1 no instala Chromium en ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    env:
      CORE_URL: ${{ vars.CORE_URL }}
      # Opcional: URL de Assistant.Api. Sin ella el chat queda desactivado en el front publicado.
      ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests del front
        run: dotnet test src/Web.Tests --configuration Release
      - name: Configurar appsettings
        # Antes de publicar, no después: el service worker precarga appsettings.json comprobando el hash del
        # manifiesto que genera el publish; si se reescribiera tras publicar, el worker no se instalaría.
        run: |
          set -euo pipefail
          test -n "$CORE_URL" || { echo "Falta la variable de repositorio CORE_URL"; exit 1; }
          conf=src/Web/wwwroot/appsettings.json
          jq --arg c "$CORE_URL" --arg a "$ASSISTANT_URL" '.Api.CoreUrl = $c | .Api.AssistantUrl = $a' "$conf" > "$conf.tmp"
          mv "$conf.tmp" "$conf"
      - run: dotnet publish src/Web -c Release -o salida
      - name: Cabeceras y CSP
        run: |
          set -euo pipefail
          pub=salida/wwwroot
          # Supabase:Url sale del propio appsettings.json para que CSP y configuración no diverjan.
          export SUPABASE_URL=$(jq -r '.Supabase.Url' "$pub/appsettings.json")
          envsubst '${SUPABASE_URL} ${CORE_URL} ${ASSISTANT_URL}'< src/Web/cloudflare/_headers.template > "$pub/_headers"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prueba de la PWA publicada (service worker, sin conexión, actualización y CSP)
        run: |
          npm ci --prefix tests/pwa
          npx --prefix tests/pwa playwright install --with-deps chromium
          node tests/pwa/probar.mjs salida/wwwroot
      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy salida/wwwroot --project-name=miparte --branch=master
