name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: miparte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pg
      MIPARTE_TEST_DB: Host=localhost;Database=miparte;Username=postgres;Password=pg
      # Core.Api arranca en las pruebas con el rol de mínimo privilegio, como en producción (la contraseña solo vale aquí).
      MIPARTE_TEST_DB_API: Host=localhost;Database=miparte;Username=miparte_api;Password=api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Aplicar la estructura (proyecto de base de datos, con esquema auth simulado)
        run: dotnet run --project src/Database/MiParte.Database --configuration Release -- migrar --con-auth-stub --conexion "$MIPARTE_TEST_DB"
      - name: Contraseña del rol de la API (la migración lo crea sin ella)
        run: psql "host=localhost dbname=miparte user=postgres" -v ON_ERROR_STOP=1 -c "alter role miparte_api password 'api'"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
  pwa:
    # Publica el front y lo prueba con su service worker real servido como Cloudflare Pages (ver tests/pwa).
    # Fijado: Playwright 1.56.1 no instala Chromium en ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet publish src/Web -c Release -o salida
      - name: Cabeceras y CSP (como en deploy-web.yml, con las URLs del appsettings.json del repositorio)
        run: |
          set -euo pipefail
          pub=salida/wwwroot
          export SUPABASE_URL=$(jq -r '.Supabase.Url' "$pub/appsettings.json")
          export CORE_URL=$(jq -r '.Api.CoreUrl' "$pub/appsettings.json")
          export ASSISTANT_URL=$(jq -r '.Api.AssistantUrl' "$pub/appsettings.json")
          envsubst '${SUPABASE_URL} ${CORE_URL} ${ASSISTANT_URL}'< src/Web/cloudflare/_headers.template > "$pub/_headers"
      - name: Prueba de la PWA publicada
        run: |
          npm ci --prefix tests/pwa
          npx --prefix tests/pwa playwright install --with-deps chromium
          node tests/pwa/probar.mjs salida/wwwroot
