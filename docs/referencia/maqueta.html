<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mi parte, tu parte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap">
<style>
/* Layout: cabecera con selector de hogar y menú de usuario, barra "Asume" fija en burdeos con un chip por miembro,
   y pestañas de trabajo. Cada miembro tiene color + inicial (paleta de 8 tonos --m0..--m7). */
:root {
  --bg: #FBF5EF;
  --surface: #FFFFFF;
  --surface-2: #F5EAE1;
  --ink: #24161A;
  --ink-2: #6B5A5E;
  --line: #E6D8CC;
  --wine: #7A1F33;
  --wine-text: #7A1F33;
  --wine-soft: #F3DDE2;
  --on-wine: #FFFFFF;
  --on-wine-dim: rgba(255, 255, 255, .72);
  --orange: #E8742A;
  --orange-text: #A8480F;
  --orange-soft: #FDE7D6;
  --on-orange: #24161A;
  --bar-amt: #FFC083;
  --err: #C62828;
  --ok: #2E7D5B;
  --ok-soft: #E6F2EC;
  --m0: #7A1F33; --m0-on: #FFFFFF;
  --m1: #E8742A; --m1-on: #24161A;
  --m2: #0F766E; --m2-on: #FFFFFF;
  --m3: #2F5DA8; --m3-on: #FFFFFF;
  --m4: #7B3FA0; --m4-on: #FFFFFF;
  --m5: #6B7D1E; --m5-on: #FFFFFF;
  --m6: #C2185B; --m6-on: #FFFFFF;
  --m7: #5C5148; --m7-on: #FFFFFF;
  --shadow: 0 1px 2px rgba(60, 15, 25, .06), 0 8px 24px rgba(60, 15, 25, .05);
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1114;
    --surface: #2A1A1F;
    --surface-2: #35222A;
    --ink: #F5ECE6;
    --ink-2: #C8A9AD;
    --line: #47282F;
    --wine: #A32D40;
    --wine-text: #E08A9C;
    --wine-soft: #44202A;
    --orange: #F2904A;
    --orange-text: #F8A862;
    --orange-soft: #3F2813;
    --err: #FF8F86;
    --ok: #7FD39B;
    --ok-soft: #173424;
    --m0: #E08A9C; --m0-on: #1C1114;
    --m1: #F2904A; --m1-on: #1C1114;
    --m2: #3DBFB2; --m2-on: #1C1114;
    --m3: #7DA7F0; --m3-on: #1C1114;
    --m4: #C38DE8; --m4-on: #1C1114;
    --m5: #B6CA5C; --m5-on: #1C1114;
    --m6: #F27BA9; --m6-on: #1C1114;
    --m7: #C4B8AC; --m7-on: #1C1114;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1114;
  --surface: #2A1A1F;
  --surface-2: #35222A;
  --ink: #F5ECE6;
  --ink-2: #C8A9AD;
  --line: #47282F;
  --wine: #A32D40;
  --wine-text: #E08A9C;
  --wine-soft: #44202A;
  --orange: #F2904A;
  --orange-text: #F8A862;
  --orange-soft: #3F2813;
  --err: #FF8F86;
  --ok: #7FD39B;
  --ok-soft: #173424;
  --m0: #E08A9C; --m0-on: #1C1114;
  --m1: #F2904A; --m1-on: #1C1114;
  --m2: #3DBFB2; --m2-on: #1C1114;
  --m3: #7DA7F0; --m3-on: #1C1114;
  --m4: #C38DE8; --m4-on: #1C1114;
  --m5: #B6CA5C; --m5-on: #1C1114;
  --m6: #F27BA9; --m6-on: #1C1114;
  --m7: #C4B8AC; --m7-on: #1C1114;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  padding-inline: 16px;
  padding-block: 0 56px;
  font: 15px/1.5 var(--font-body);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul { margin: 0; }
h2, h3 { text-wrap: balance; }
button { font: inherit; }
.wrap { max-width: 1080px; margin-inline: auto; }
.muted { color: var(--ink-2); }
[hidden] { display: none !important; }
.fieldrow .err { min-height: 0; }
.fieldrow .err:empty { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cabecera */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 14px 24px; padding-block: 22px 16px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { flex: none; }
.logo .h1 { fill: var(--orange); }
.logo .h2 { fill: var(--wine); }
:root[data-theme="dark"] .logo .h2 { fill: var(--wine-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .h2 { fill: var(--wine-text); } }
.brand h1 { font: 600 1.6rem/1.1 var(--font-display); letter-spacing: -.015em; white-space: nowrap; }
.brand h1 .w1 { color: var(--wine-text); }
.brand h1 .dot { color: var(--orange); padding-inline: .3em; font-weight: 400; }
.brand h1 .w2 { color: var(--orange-text); font-style: italic; font-weight: 400; }
.brand p { margin-top: 3px; color: var(--ink-2); font-size: .85rem; }
.right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.chip {
  font-size: .7rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--orange-text); background: var(--orange-soft); padding: 5px 11px; border-radius: 999px; white-space: nowrap;
}
.monthnav { display: flex; align-items: center; gap: 8px; }
.mlabel { min-width: 8.5rem; text-align: center; font-weight: 600; }
.iconbtn {
  width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 50%; font-size: 1.2rem; line-height: 1; padding: 0;
}
.iconbtn:hover:not([disabled]) { background: var(--surface-2); }
.iconbtn[disabled] { opacity: .35; cursor: not-allowed; }

/* Menús desplegables */
.dd { position: relative; }
.menubtn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; max-width: 15rem;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .9rem;
}
.menubtn:hover { background: var(--surface-2); }
.menubtn .mb-lab { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.menubtn .mb-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.menubtn .caret { font-size: .7rem; color: var(--ink-2); }
.menubtn.user { padding: 0 10px 0 4px; }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 15rem; max-width: calc(100vw - 32px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(40, 10, 20, .22);
  padding: 6px; display: grid; gap: 2px;
}
.mhead { padding: 8px 10px 6px; font-size: .78rem; color: var(--ink-2); overflow-wrap: anywhere; }
.mhead b { display: block; color: var(--ink); font-size: .9rem; }
.mitem {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink);
  padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .92rem;
}
.mitem:hover, .mitem:focus-visible { background: var(--surface-2); }
.mitem .tick { width: 1em; color: var(--wine-text); font-weight: 700; flex: none; }
.mitem small { margin-left: auto; color: var(--ink-2); font-weight: 500; font-size: .76rem; white-space: nowrap; }
.msep { height: 1px; background: var(--line); margin: 4px 2px; }

/* Avatares de miembro: color + inicial */
.av {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; flex: none;
  font-size: .72rem; font-weight: 700; line-height: 1; font-family: var(--font-body);
}
.av.sm { width: 18px; height: 18px; font-size: .62rem; }
.av.lg { width: 34px; height: 34px; font-size: .95rem; }
.who { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; min-width: 0; }

/* Barra de resumen */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
  background: var(--wine); color: var(--on-wine);
  border-radius: var(--radius); padding: 12px 18px; box-shadow: var(--shadow);
}
.bar .grp { display: flex; align-items: center; gap: 6px 14px; min-width: 0; }
.bar .grp.asume { flex: 1 1 18rem; }
.bar .grp.saldo { flex: 1 1 18rem; }
.bar .grp:last-child:not(:first-child) { margin-inline-start: auto; }
.bar .lab { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--on-wine-dim); flex: none; }
.bar .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-width: 0; }
.bar .bit { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar .av { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
.bar .debt {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px;
  background: rgba(255, 255, 255, .14); padding: 5px 14px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.bar .debt .amt { color: var(--bar-amt); }
.bar .soft { color: var(--on-wine-dim); font-size: .85rem; }
@media (max-width: 640px) {
  .bar .grp.asume, .bar .grp.saldo { flex-basis: 100%; }
  .bar .chips { flex-wrap: nowrap; overflow-x: auto; padding: 3px 3px 5px; margin: -3px; scrollbar-width: thin; }
}

/* Pestañas */
.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; white-space: nowrap;
  color: var(--ink-2); font-weight: 600; padding: 11px 16px; border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab:hover:not([disabled]) { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--wine-text); border-bottom-color: var(--orange); }
.tab[disabled] { cursor: not-allowed; opacity: .75; }
.tab .soon { margin-left: 6px; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; background: var(--surface-2); color: var(--ink-2); padding: 2px 7px; border-radius: 999px; }
.panel { padding-block: 22px 0; display: grid; gap: 18px; }
.panel:focus { outline: none; }

button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* Tarjetas y estructura */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font: 600 1.2rem/1.25 var(--font-display); }
.card h3 { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-top: 20px; }
.card > p.muted { margin-top: 4px; font-size: .88rem; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 8px; }
.cols2 { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.cols-form { display: grid; gap: 18px; grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); align-items: start; }
.cols-even { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 880px) { .cols2, .cols-form, .cols-even { grid-template-columns: minmax(0, 1fr); } }

.stats {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.stat { background: var(--surface); padding: 13px 18px; min-width: 0; }
.stat span { display: block; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.stat strong { display: block; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat strong.neg { color: var(--err); }
@media (max-width: 480px) { .stat { padding: 11px 12px; } .stat strong { font-size: 1.02rem; } }

/* Controles */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); max-width: 100%; }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: .85rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wine); color: var(--on-wine); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1 1 0; padding-block: 8px; }

label { display: grid; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--ink-2); min-width: 0; }
input, select {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 12px; height: 42px; width: 100%; min-width: 0;
}
input[disabled], select[disabled] { opacity: .6; }
input[aria-invalid="true"] { border-color: var(--err); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.full { grid-column: 1 / -1; }
@media (max-width: 430px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.form { display: grid; gap: 4px; align-content: start; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
.err { color: var(--err); font-size: .85rem; min-height: 1.2em; }
.chk { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 600; color: var(--ink); cursor: pointer; margin-top: 10px; }
.chk input { width: 20px; height: 20px; padding: 0; accent-color: var(--wine); flex: none; }
.tbl td.neg { color: var(--err); }
.tbl td.pos { color: var(--ok); }
.card-stack { display: grid; gap: 18px; min-width: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px;
  border-radius: 8px; border: 1px solid transparent; font-weight: 700; cursor: pointer; background: var(--wine); color: var(--on-wine);
}
.btn:hover:not([disabled]) { filter: brightness(1.1); }
.btn-orange { background: var(--orange); color: var(--on-orange); }
.btn-ghost { background: transparent; color: var(--wine-text); border-color: var(--line); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: .85rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.linkbtn { border: 0; background: none; color: var(--wine-text); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: .88rem; }

.preview {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 14px; min-height: 46px;
  background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: .9rem; font-variant-numeric: tabular-nums;
}
.pv-lab { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.pv-it { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* Lista de gastos */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: .82rem; margin-block: 8px 6px; align-items: center; }
.legend .who { font-weight: 600; color: var(--ink); }
.expsum { color: var(--ink-2); font-size: .85rem; }
.listhead select { width: auto; max-width: 100%; height: 38px; font-size: .88rem; }
.exp-list { list-style: none; margin: 8px 0 0; padding: 0; }
.exp { display: grid; grid-template-columns: minmax(0, 1fr) auto 34px; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.exp:first-child { border-top: 0; }
.exp-title { font-weight: 600; overflow-wrap: anywhere; }
.exp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; color: var(--ink-2); font-size: .82rem; }
.exp-amt { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.exp-amt strong { display: block; }
.split { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 10px; font-size: .78rem; color: var(--ink-2); max-width: 15rem; margin-left: auto; }
.sp { display: inline-flex; align-items: center; gap: 5px; }
.del { width: 34px; height: 34px; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--ink-2); cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0; flex: none; }
.del:hover:not([disabled]) { background: var(--surface-2); color: var(--wine-text); }
.del[disabled] { opacity: .3; cursor: not-allowed; }
.empty { padding: 28px 8px; text-align: center; display: grid; gap: 14px; justify-items: center; color: var(--ink-2); }
@media (max-width: 520px) { .exp { grid-template-columns: minmax(0, 1fr) 34px; } .exp-amt { grid-column: 1; grid-row: 2; text-align: left; } .split { justify-content: flex-start; margin-left: 0; max-width: none; } .exp .del { grid-column: 2; grid-row: 1; } }

/* Gráficos */
.chart { display: grid; gap: 2px; }
.crow { display: grid; grid-template-columns: minmax(0, 9rem) minmax(0, 1fr) 6rem; gap: 12px; align-items: center; padding-block: 7px; }
.cname { overflow-wrap: anywhere; font-size: .9rem; }
.track { height: 20px; background: var(--surface-2); border-radius: 7px; overflow: hidden; }
.fill { height: 100%; display: flex; border-radius: 7px; overflow: hidden; }
.seg-m { height: 100%; display: grid; place-items: center; font-size: .66rem; font-weight: 700; overflow: hidden; border-right: 1px solid var(--surface); min-width: 0; }
.seg-m:last-child { border-right: 0; }
.fill-one { height: 100%; border-radius: 7px; }
.cval { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; font-size: .9rem; }
.crow.stack { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
.crow.stack .cname { grid-row: 1; grid-column: 1; }
.crow.stack .cval { grid-row: 1; grid-column: 2; }
.crow.stack .track { grid-row: 2; grid-column: 1 / -1; }
@media (max-width: 520px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .crow .cname { grid-row: 1; grid-column: 1; }
  .crow .cval { grid-row: 1; grid-column: 2; }
  .crow .track { grid-row: 2; grid-column: 1 / -1; }
}
.pcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 24px; margin-top: 8px; }
@media (max-width: 640px) { .pcols { grid-template-columns: minmax(0, 1fr); } }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font: 600 1rem var(--font-body); margin: 0 0 2px; letter-spacing: 0; text-transform: none; color: var(--ink); }
.ptot { font-variant-numeric: tabular-nums; font-weight: 700; }
.psub { font-size: .82rem; color: var(--ink-2); margin-bottom: 6px; }

/* Tablas y liquidación */
.tblwrap { overflow-x: auto; margin-top: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
.tbl th { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl .num { text-align: right; }
.tbl tfoot td { font-weight: 700; border-bottom: 0; }
.settle { margin-top: 16px; padding: 16px 18px; border-radius: var(--radius); background: var(--orange-soft); }
.settle.ok { background: var(--wine-soft); }
.settle-line { font: 500 1.3rem/1.35 var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
.settle-line .who { font: inherit; font-weight: 600; }
.settle-line b { color: var(--orange-text); font-weight: 600; white-space: nowrap; }

function parseCents(s) {
  s = String(s).trim().replace(/\s|€/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
// Pesos por adulto activo según el perfil. Sin pesos válidos se reparte a partes iguales.
function pesos(H, prof, mes, payer) {
  const ads = adultosDe(H);
  let w;
  if (prof.modo === 'ingresos') w = ads.map(a => Number(H.prop[a.id]) || 0);
  else if (prof.modo === 'partes' || prof.modo === 'porcentaje') w = ads.map(a => Number(prof.detalle[a.id]) || 0);
  else w = ads.map(a => (a.id === payer ? 1 : 0));
  if (!w.some(x => x > 0)) w = ads.map(() => 1);
  return { ads, w };
}
// El último adulto con peso absorbe el céntimo sobrante, como en Reparto.Dividir del servidor.
function repartir(H, importe, prof, mes, payer) {
  const { ads, w } = pesos(H, prof, mes, payer);
  const t = w.reduce((s, x) => s + x, 0);
  let last = -1; w.forEach((x, i) => { if (x > 0) last = i; });
  const rep = {}, pct = {}; let acc = 0;
  ads.forEach((a, i) => {
    let v = i === last ? importe - acc : Math.round(importe * w[i] / t);
    if (w[i] <= 0) v = 0;
    rep[a.id] = v; acc += v; pct[a.id] = w[i] / t * 100;
  });
  return { rep, pct };
}
function addGasto(H, o) {
  const prof = H.perfiles.find(p => p.id === o.pid);
  const cargo = (o.payer === 'c' || (H.cuenta.activa && o.cargo)) ? 'c' : 'p';
  if (cargo === 'c') {
    // La cuenta común asume el 100 %: el reparto proporcional ya se hizo con las aportaciones.
    H.gastos.push({ id: nid('e'), fecha: o.fecha, concepto: o.concepto, importe: o.importe, cat: o.cat, payer: o.payer, cargo: 'c', pid: null, pn: MODOS.cc, modo: 'cc', rep: {}, pct: {} });
    return;

  H.gastos.push({ id: nid('e'), fecha: o.fecha, concepto: o.concepto, importe: o.importe, cat: o.cat, payer: o.payer, cargo: 'p', pid: prof.id, pn: prof.nombre, modo: prof.modo, rep: r.rep, pct: r.pct });

  const used = new Set(H.miembros.map(x => x.color)); let c = 0;

  if (c >= 8) c = H.miembros.length % 8;
  const m = { id: nid('m'), nombre, tipo, resp: resp || null, activo: true, rol: rol || 'miembro', color: c };

  if (tipo === 'adulto') { H.prop[m.id] = 0; H.perfiles.forEach(p => { if (p.modo === 'partes') p.detalle[m.id] = 1; if (p.modo === 'porcentaje') p.detalle[m.id] = 0; }); }

  const P = modo => H.perfiles.find(p => p.modo === modo).id;
  H.cats = [['Hipoteca/Alquiler', 'ingresos', true], ['Alimentación', 'ingresos', true], ['Suministros', 'ingresos', true], ['Gastos varios de casa', 'ingresos', true], ['Hijo', 'partes', false], ['Ocio personal', 'individual', false]]

}

function monthData(m) {
  const H = hog();
  const ex = H.gastos.filter(e => e.fecha.startsWith(m));
  const paid = {}, assumed = {}, byCat = {}, reimb = {}; let total = 0, spent = 0, direct = 0;
  ex.forEach(e => {
    total += e.importe;
    if (e.payer !== 'c') paid[e.payer] = (paid[e.payer] || 0) + e.importe;
    const c = byCat[e.cat] || (byCat[e.cat] = { t: 0, by: {} }); c.t += e.importe;
    for (const id in e.rep) { assumed[id] = (assumed[id] || 0) + e.rep[id]; c.by[id] = (c.by[id] || 0) + e.rep[id]; }
    if (e.cargo === 'c') {
      // A cargo de la cuenta común: la cuenta asume el 100 % y no se genera deuda entre personas.
      spent += e.importe; assumed.c = (assumed.c || 0) + e.importe; c.by.c = (c.by.c || 0) + e.importe;
      if (e.payer === 'c') direct += e.importe; else reimb[e.payer] = (reimb[e.payer] || 0) + e.importe;
    }
  });
  const pays = H.pagos.filter(p => p.month === m);
  const mem = H.miembros.filter(x => x.tipo === 'adulto' && (x.activo || paid[x.id] || assumed[x.id]));
  const bal = {};
  mem.forEach(x => { bal[x.id] = 0; });
  ex.forEach(e => {
    if (e.cargo === 'c') return;
    bal[e.payer] = (bal[e.payer] || 0) + e.importe;
    for (const id in e.rep) bal[id] = (bal[id] || 0) - e.rep[id];
  });
  pays.forEach(p => { if (p.from === 'c') return; bal[p.from] = (bal[p.from] || 0) + p.amount; bal[p.to] = (bal[p.to] || 0) - p.amount; });
  const contrib = H.cuenta.activa ? (H.cuenta.aport[m] || {}) : {};
  const contribTotal = Object.values(contrib).reduce((s, x) => s + x, 0);
  return { ex, paid, assumed, total, byCat, pays, bal, mem, xfers: transferencias(bal), spent, direct, reimb, contrib, contribTotal };
}
// Estado acumulado de la cuenta común hasta el mes m.
// saldo = aportaciones - gastos a cargo de la cuenta (incluye lo pendiente de reembolsar)
// cash = dinero que hay ahora en la cuenta; pend = lo que la cuenta debe a cada persona
function accountState(m) {
  let contrib = 0, charged = 0, direct = 0, back = 0; const pend = {};
  for (const k of MONTHS) {
    const d = monthData(k);
    contrib += d.contribTotal; charged += d.spent; direct += d.direct;
    for (const id in d.reimb) pend[id] = (pend[id] || 0) + d.reimb[id];
    d.pays.forEach(p => { if (p.from === 'c') { pend[p.to] = (pend[p.to] || 0) - p.amount; back += p.amount; } });
    if (k === m) break;
  }
  const pendTotal = Object.values(pend).reduce((s, x) => s + x, 0);
  return { saldo: contrib - charged, cash: contrib - direct - back, pend, pendTotal };
}
// Saldo de cada persona (positivo = dinero a su favor): lo que la cuenta le debe + lo que le deben las otras personas.
function saldos(m) {
  const d = monthData(m), acc = accountState(m), total = {};
  d.mem.forEach(x => { total[x.id] = (d.bal[x.id] || 0) + (acc.pend[x.id] || 0); });
  return { total, acc };
}
// Transferencias mínimas: el mayor deudor paga al mayor acreedor hasta saldar.
function transferencias(bal) {
  const c = [], d = [], out = [];
  for (const id in bal) { if (bal[id] > 0) c.push([id, bal[id]]); else if (bal[id] < 0) d.push([id, -bal[id]]); }
  while (c.length && d.length) {
    c.sort((x, y) => y[1] - x[1]); d.sort((x, y) => y[1] - x[1]);
    const t = Math.min(c[0][1], d[0][1]);
    out.push({ de: d[0][0], a: c[0][0], importe: t });
    c[0][1] -= t; d[0][1] -= t;
    if (!c[0][1]) c.shift();
    if (!d[0][1]) d.shift();
  }
  return out;
}

    body = h('div', { class: 'pbody' }, h('p', { class: 'muted', style: { fontSize: '.88rem' }, text: p.modo === 'ingresos' ? 'Sin detalle: usa la proporción de ingresos del hogar.' : 'Sin detalle: el gasto lo asume entero quien lo paga.' }));
  }
  return h('details', { class: 'prof', open: state.openProf === p.id, ontoggle: ev => { if (ev.target.open) state.openProf = p.id; else if (state.openProf === p.id) state.openProf = null; } },
    h('summary', {}, h('span', { class: 'pn' }, p.nombre, h('span', { class: 'tag', text: MODOS[p.modo] })), h('span', { class: 'psum' }, resumenPerfil(H, p))), body);
}

/* ---------- Categorías ---------- */
function panelCategorias() {
  const H = hog(), d = monthData(state.month);
  const used = id => H.gastos.some(e => e.cat === id);
  const row = c => {
    const sel = h('select', { class: 'c-sel', 'aria-label': 'Reparto por defecto de ' + c.nombre, onchange: ev => { c.pid = ev.target.value; } }, profileOptions(H));
    sel.value = c.pid;
    const inUse = used(c.id);
    return h('div', { class: 'catrow' },
      h('input', { class: 'c-name', type: 'text', value: c.nombre, maxlength: '100', 'aria-label': 'Nombre de la categoría', autocomplete: 'off', oninput: ev => { c.nombre = ev.target.value; } }),
      sel,
      h('label', { class: 'chk c-chk' }, h('input', { type: 'checkbox', checked: !!c.cargo, 'aria-label': 'A cargo de la cuenta común por defecto: ' + c.nombre, onchange: ev => { c.cargo = ev.target.checked; } }), 'A cargo de la cuenta'),
      h('span', { class: 'c-amt', text: (d.byCat[c.id] ? eur(d.byCat[c.id].t) : eur(0)) + ' este mes' }),
      h('button', {
        class: 'del c-del', type: 'button', disabled: inUse, 'aria-label': 'Eliminar ' + c.nombre,
        title: inUse ? 'Tiene gastos y no se puede eliminar' : 'Eliminar categoría',
        onclick: () => { H.cats = H.cats.filter(x => x.id !== c.id); renderPanel(); toast('Categoría eliminada'); }
      }, '×'));
  };
  const newName = h('input', { id: 'nc-name', type: 'text', maxlength: '100', placeholder: 'Ej. Transporte', autocomplete: 'off' });
  const newPid = h('select', { id: 'nc-pid' }, profileOptions(H));
  const newCargo = h('input', { id: 'nc-cargo', type: 'checkbox' });
  const err = h('p', { class: 'err', role: 'alert' });
  const add = h('form', {
    class: 'addcat', novalidate: true,
    onsubmit: ev => {
      ev.preventDefault();
      const n = newName.value.trim();
      if (!n) { err.textContent = 'Escribe un nombre para la categoría.'; newName.focus(); return; }
      if (H.cats.some(c => c.nombre.trim().toLowerCase() === n.toLowerCase())) { err.textContent = 'Ya existe una categoría con ese nombre.'; return; }
      H.cats.push({ id: nid('c'), nombre: n, pid: newPid.value, cargo: newCargo.checked });
      renderPanel(); toast('Categoría añadida');
    }
  }, h('label', {}, 'Nueva categoría', newName), h('label', {}, 'Reparto por defecto', newPid), h('label', { class: 'chk' }, newCargo, 'A cargo de la cuenta'), h('button', { class: 'btn', type: 'submit' }, 'Añadir categoría'));
  return h('section', { class: 'card' },
    h('h2', { text: 'Categorías de ' + H.nombre }),
    h('p', { class: 'muted', text: 'Define cómo se reparte por defecto cada tipo de gasto. Los cambios afectan a los gastos nuevos; los ya registrados conservan su reparto. «A cargo de la cuenta» solo se aplica si el hogar usa cuenta común.' }),
    h('div', { class: 'cathead', 'aria-hidden': 'true' }, h('span', { text: 'Categoría' }), h('span', { text: 'Reparto por defecto' }), h('span', { text: 'Cuenta común' }), h('span', { text: 'Gastado' }), h('span')),
    H.cats.length ? H.cats.map(row) : h('div', { class: 'empty' }, h('p', { text: 'Este hogar no tiene categorías. Crea la primera abajo.' })),
    add, err);
}

const PANELS = { resumen: panelResumen, gastos: panelGastos, hogar: panelHogar, categorias: panelCategorias };

$('#tabs').addEventListener('keydown', ev => {
  const ids = TABS.map(t => t[0]).filter(x => x !== 'chat');
  let i = ids.indexOf(state.tab);
  if (ev.key === 'ArrowRight') i = (i + 1) % ids.length;
  else if (ev.key === 'ArrowLeft') i = (i + ids.length - 1) % ids.length;
  else return;
  ev.preventDefault();
  selectTab(ids[i]);
  $('#tab-' + ids[i]).focus();
});

render();
</script>


</body></html>
