<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mi parte, tu parte</title>
    <base href="/" />
    <meta name="theme-color" content="#7A1F33" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/tema.js"></script>
    <script src="js/compartir-resumen.js"></script>
    <script src="js/avisos-push.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
</head>

<body>
    <div id="app">
        <div class="arranque" role="status" aria-label="Cargando">
            <svg class="logo" width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
                <g transform="rotate(45 50 50)">
                    <path class="h1" d="M42 11 A33 33 0 0 0 42 77 Z"></path>
                    <path class="h2" d="M48 14 A40 40 0 0 1 48 94 Z"></path>
                </g>
            </svg>
            <div class="spin"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">&times;</a>
    </div>
    <!-- registrar-sw.js antes que Blazor: AvisoActualizacion lo llama al pintarse y, si aún no existe, la app falla al arrancar. -->
    <script src="js/registrar-sw.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
