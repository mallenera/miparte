name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: miparte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pg
      MIPARTE_TEST_DB: Host=localhost;Database=miparte;Username=postgres;Password=pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Aplicar migraciones (con esquema auth simulado)
        run: |
          psql -h localhost -U postgres -d miparte -v ON_ERROR_STOP=1 -f supabase/tests/auth_stub.sql
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d miparte -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
