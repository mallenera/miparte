name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: miparte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pg
      MIPARTE_TEST_DB: Host=localhost;Database=miparte;Username=postgres;Password=pg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Aplicar la estructura (proyecto de base de datos, con esquema auth simulado)
        run: dotnet run --project src/Database/MiParte.Database --configuration Release -- migrar --con-auth-stub --conexion "$MIPARTE_TEST_DB"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
