# Blueprint de Render para Core.Api (plan gratuito: se duerme tras 15 min sin tráfico). Los valores con
# sync: false se piden al crear el Blueprint y nunca viven en el repo. Ver docs/despliegue.md.
services:
  - type: web
    name: miparte-core
    runtime: docker
    plan: free
    dockerfilePath: ./src/Core/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Solo despliega cuando CI (build + tests) pasa en master.
    autoDeployTrigger: checksPass
    envVars:
      # El Dockerfile escucha en 8080; sin esto Render espera el puerto 10000.
      - key: PORT
        value: "8080"
      # Render es un proxy inverso: sin esto el limitador por IP vería siempre la IP del proxy.
      - key: ProxyInverso__Confiar
        value: "true"
      - key: Supabase__Url
        sync: false
      - key: ConnectionStrings__Default
        sync: false
      - key: Cors__OrigenesPermitidos__0
        sync: false

  # Chatbot (Assistant.Api). Consulta los datos del hogar a Core.Api con el JWT de la persona, así que no necesita
  # cadena de conexión. ANTHROPIC_API_KEY es un secreto: solo se escribe en Render, nunca en el repo.
  - type: web
    name: miparte-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./src/Assistant/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: Supabase__Url
        sync: false
      # Solo si el proyecto aún usa el secreto HS256 legado; déjalo vacío para validar con JWKS.
      - key: Supabase__JwtSecret
        sync: false
      # URL de Core.Api, p. ej. https://miparte-core.onrender.com
      - key: Asistente__CoreUrl
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: Cors__OrigenesPermitidos__0
        sync: false
