# Las variables se leen de .env (opcional, ver .env.example) o del entorno. Sin secretos en el repo.
services:
  core:
    build:
      context: .
      dockerfile: src/Core/Dockerfile
    ports: ["5001:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      Supabase__Url: ${Supabase__Url:-}
      Supabase__JwtSecret: ${Supabase__JwtSecret:-}
      ConnectionStrings__Default: ${ConnectionStrings__Default:-}
      Cors__OrigenesPermitidos__0: ${Cors__OrigenesPermitidos__0:-}
  assistant:
    build:
      context: .
      dockerfile: src/Assistant/Dockerfile
    ports: ["5002:8080"]
    # Sin env_file: el .env completo incluye la cadena de la base de datos, que solo debe llegar a Core.
    environment:
      Supabase__Url: ${Supabase__Url:-}
      Supabase__JwtSecret: ${Supabase__JwtSecret:-}
      Cors__OrigenesPermitidos__0: ${Cors__OrigenesPermitidos__0:-}
      # Los datos del hogar se consultan a Core.Api (red interna de compose), con el JWT de la persona.
      Asistente__CoreUrl: http://core:8080
      Asistente__Modelo: ${Asistente__Modelo:-claude-sonnet-5-5}
      # Solo por entorno (nunca en el repo). Sin ella el chat responde 503.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [core]
  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    ports: ["8080:8080"]
    environment:
      # Orígenes de la CSP (connect-src): Supabase Auth y Core.Api tal como los ve el navegador.
      SUPABASE_URL: ${Supabase__Url:-}
      CORE_URL: ${CoreUrl:-http://localhost:5001}
      ASSISTANT_URL: ${AssistantUrl:-http://localhost:5002}
    depends_on: [core, assistant]
